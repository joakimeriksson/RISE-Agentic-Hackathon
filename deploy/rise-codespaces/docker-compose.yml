# RISE Codespaces — self-hosted Coder control plane.
# One VM with Docker is enough for ~30 hackathon participants.
# See README.md in this directory for the full setup walkthrough.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro        # optional: RISE-issued wildcard cert, see README
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CODER_DOMAIN=${CODER_DOMAIN}
    depends_on:
      - coder

  coder:
    image: ghcr.io/coder/coder:latest
    restart: unless-stopped
    environment:
      CODER_PG_CONNECTION_URL: "postgresql://coder:${POSTGRES_PASSWORD}@database/coder?sslmode=disable"
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      CODER_ACCESS_URL: "https://${CODER_DOMAIN}"
      # Wildcard lets every workspace app (Vite preview, code-server) get its own
      # subdomain, which is what makes dev servers with absolute asset paths work.
      CODER_WILDCARD_ACCESS_URL: "*.${CODER_DOMAIN}"
      # Trust Caddy as the TLS terminator.
      CODER_PROXY_TRUSTED_HEADERS: "X-Forwarded-For"
      CODER_PROXY_TRUSTED_ORIGINS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      # Dev-server ports forwarded via subdomain are only allowed for the owner
      # by default; keep it that way for an event.
      CODER_TELEMETRY_ENABLE: "false"
      # Optional: Entra ID / any OIDC login (see README). Leave unset for
      # password accounts created by the facilitator.
      CODER_OIDC_ISSUER_URL: "${CODER_OIDC_ISSUER_URL:-}"
      CODER_OIDC_CLIENT_ID: "${CODER_OIDC_CLIENT_ID:-}"
      CODER_OIDC_CLIENT_SECRET: "${CODER_OIDC_CLIENT_SECRET:-}"
      CODER_OIDC_EMAIL_DOMAIN: "${CODER_OIDC_EMAIL_DOMAIN:-}"
    # The Docker socket is how the template provisions one container per
    # participant. This is a trusted-operator setup: anyone who is a Coder
    # *template admin* can effectively control the host. Participants cannot.
    group_add:
      - "${DOCKER_GROUP_ID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coder
    volumes:
      - coder_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coder_pg:
  caddy_data:
  caddy_config:
